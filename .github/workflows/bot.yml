name: maxbot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Run bot
        env:
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          GIGA_KEY: ${{ secrets.GIGA_KEY }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "maxbot"
          git config user.email "maxbot@users.noreply.github.com"
          git add state.txt
          git commit -m "update state" || echo "no changes"
          git push
